<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>CityVoice, Alexa+ Simulator</title>
        <meta
            name="description"
            content="Report a problem in your street to your city, by voice, through a simulated Alexa+."
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
        <link rel="stylesheet" href="/style.css" />
        <script type="module" src="/app.js" defer></script>
    </head>
    <body>
        <header class="topbar">
            <a class="wordmark" href="/" aria-label="CityVoice, home">
                <svg viewBox="0 0 24 24" aria-hidden="true" class="wordmark-mark">
                    <path
                        d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"
                    />
                </svg>
                <span>CityVoice</span>
                <span class="wordmark-tag">Alexa+ simulator</span>
            </a>
            <div class="account">
                <span id="account-status" class="account-status">Checking your account</span>
                <a id="link-button" class="pill-button primary" href="/login" hidden>Link account</a>
                <form id="unlink-form" method="post" action="/logout" hidden>
                    <button class="pill-button" type="submit">Unlink</button>
                </form>
            </div>
        </header>

        <nav class="rail" aria-label="Simulator">
            <button id="reset" class="rail-button" type="button" title="New conversation" aria-label="New conversation">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3a9 9 0 1 1-8.5 6h2.2A7 7 0 1 0 12 5v3L7.5 4 12 0v3Z" />
                </svg>
            </button>
            <button
                id="scenes-toggle"
                class="rail-button"
                type="button"
                title="Behind the scenes"
                aria-label="Behind the scenes"
                aria-controls="scenes"
                aria-expanded="false"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="m8.6 16.6-4.6-4.6 4.6-4.6L7.2 6 1.2 12l6 6 1.4-1.4Zm6.8 0 4.6-4.6-4.6-4.6L16.8 6l6 6-6 6-1.4-1.4Z"
                    />
                </svg>
            </button>
        </nav>

        <main class="stage">
            <h1 id="greeting" class="greeting">Hello, how can I help?</h1>

            <section class="exchange" aria-live="polite" aria-label="Conversation">
                <p id="said" class="said" hidden></p>
                <p id="speech" class="answer" hidden></p>
                <div id="card" class="card" hidden></div>
            </section>

            <div id="voice" class="voice" data-state="idle">
                <button id="mic" class="mic" type="button" aria-label="Talk to Alexa" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"
                        />
                    </svg>
                </button>
                <button
                    id="type-toggle"
                    class="type-toggle"
                    type="button"
                    aria-label="Type instead of speaking"
                    title="Type instead of speaking"
                    aria-controls="text-form"
                    aria-expanded="false"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2Z" />
                    </svg>
                </button>
            </div>
            <p id="hint" class="hint">Tap the microphone and speak.</p>

            <form id="text-form" class="ask" hidden>
                <label class="visually-hidden" for="text-input">What you would say to Alexa</label>
                <input id="text-input" type="text" placeholder="Ask Alexa" autocomplete="off" maxlength="500" />
                <button class="ask-send" type="submit" aria-label="Send">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M11 20V7.8l-5.6 5.6L4 12l8-8 8 8-1.4 1.4L13 7.8V20h-2Z" />
                    </svg>
                </button>
            </form>

            <p class="example">Try saying <q>There's a huge pothole at 14th and U Street.</q></p>
        </main>

        <aside id="scenes" class="scenes" aria-label="Behind the scenes" hidden>
            <div class="scenes-header">
                <h2>Behind the scenes</h2>
                <button id="scenes-close" class="rail-button" type="button" aria-label="Close">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M6.4 19 5 17.6 10.6 12 5 6.4 6.4 5l5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19Z"
                        />
                    </svg>
                </button>
            </div>
            <p class="muted">Every MCP call the simulated Alexa+ made to CityVoice, newest first.</p>
            <ol id="trace" class="trace"></ol>
        </aside>
    </body>
</html>
